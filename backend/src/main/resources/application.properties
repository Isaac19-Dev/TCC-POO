# =============================================================
# CONFIGURACION DEL BACKEND — Parqueadero API
# =============================================================
# Cada ${VAR:default} lee la variable VAR del entorno del sistema.
# Si no existe, usa el valor despues de los : como default.
# Las variables vienen del .env leido por start.bat en la raiz.
# =============================================================

spring.application.name=parqueadero-api
server.port=${SERVER_PORT:8080}

# ------ BASE DE DATOS MariaDB ------
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:parqueadero_java}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ------ JPA ------
# update = crea o actualiza las tablas automaticamente al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ------ JSON ------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota

# ------ FRONTEND ------
# Cuando "mvn spring-boot:run" corre desde backend/, el CWD es backend/.
# "../frontend/" sube un nivel y apunta a la carpeta frontend/ del workspace.
spring.web.resources.static-locations=file:../frontend/,classpath:/static/

# ------ SWAGGER ------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

# ------ CREDENCIALES ------
app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:admin123}

# ------ ESPACIOS DEL PARQUEADERO ------
# Cuantos espacios fisicos tiene el parqueadero (se crean al arrancar si no existen)
app.espacios.total=${APP_ESPACIOS_TOTAL:20}
